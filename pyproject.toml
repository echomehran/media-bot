[project]
name = "music-bot"
version = "0.1.0"
description = "A Python Telegram music bot built with aiogram."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.22,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_bot"]