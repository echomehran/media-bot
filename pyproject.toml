[project]
name = "media-bot"
version = "0.1.0"
description = "A Python Telegram media bot built with aiogram."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.22,<4.0",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
