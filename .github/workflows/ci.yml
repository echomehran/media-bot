name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: test-token

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: media_bot
          POSTGRES_PASSWORD: test
          POSTGRES_DB: media_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media_bot -d media_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Configure test database
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql+asyncpg://media_bot:test@localhost:5432/media_bot_test' \
            > .env.test

      - name: Run database migrations
        run: uv run alembic -x env_file=.env.test upgrade head

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest