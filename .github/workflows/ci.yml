name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: test-token
      DATABASE_URL: postgresql+asyncpg://music_bot:test@localhost:5432/music_bot

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: music_bot
          POSTGRES_PASSWORD: test
          POSTGRES_DB: music_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest